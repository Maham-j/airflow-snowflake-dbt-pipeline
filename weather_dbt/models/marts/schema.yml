version: 2

models:
  - name: dim_city
    description: One row per city.
    columns:
      - name: city_key
        description: Key made from an md5 hash of the city name.
        data_tests:
          - unique
          - not_null
      - name: city
        data_tests:
          - not_null

  - name: dim_date
    description: One row per calendar day in the data range.
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

  - name: fact_weather_hourly
    description: One row per city per hour of weather observations.
    columns:
      - name: city_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_city')
              field: city_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key