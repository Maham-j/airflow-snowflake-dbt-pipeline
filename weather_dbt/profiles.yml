weather_dbt:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: PIPELINE_ROLE
      warehouse: WEATHER_WH
      database: WEATHER_DB
      schema: ANALYTICS
      threads: 1